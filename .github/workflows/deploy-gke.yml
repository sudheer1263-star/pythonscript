name: Deploy to GKE

on:
  push:
    branches:
      - main
      - 'Feature-*'
      - 'feature/*'
  workflow_dispatch:

env:
  PROJECT_ID: nifty-charter-463213-u8
  REGION: asia-south1
  REPOSITORY: python-repo
  IMAGE_NAME: python-app
  CLUSTER: python-app-gke
  NAMESPACE: default
  IMAGE: asia-south1-docker.pkg.dev/nifty-charter-463213-u8/python-repo/python-app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Preflight GKE checks
        run: |
          set -euo pipefail
          if [ "${{ env.CLUSTER }}" = "your-gke-cluster" ]; then
            echo "::error::CLUSTER is still the placeholder 'your-gke-cluster'. Set env.CLUSTER in .github/workflows/deploy-gke.yml to your real GKE cluster name."
            exit 1
          fi
          if ! gcloud container clusters describe "${{ env.CLUSTER }}" \
              --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
              --format="value(name)" >/dev/null 2>&1; then
            echo "::error::Cannot access cluster '${{ env.CLUSTER }}' in ${{ env.REGION }}. Check that the Kubernetes Engine API is enabled, the cluster name/region are correct, and the CI service account has roles/container.developer."
            exit 1
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }} .
          docker push ${{ env.IMAGE }}

      # Writes a kubeconfig with a short-lived token. Avoids gke-gcloud-auth-plugin,
      # which crashes in gcloud >= 571 when CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE is set.
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy manifests
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n ${{ env.NAMESPACE }} apply -k k8s
          kubectl -n ${{ env.NAMESPACE }} set image deployment/python-app python-app=${{ env.IMAGE }}
          kubectl -n ${{ env.NAMESPACE }} rollout status deployment/python-app

      - name: Show service
        run: kubectl -n ${{ env.NAMESPACE }} get svc python-app -o wide
